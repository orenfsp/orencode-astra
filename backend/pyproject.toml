[project]
name = "fsp-backend"
version = "0.1.0"
description = "Minimal FastAPI backend for the FSP MVP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
packages = ["app"]
