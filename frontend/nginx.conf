server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Положение соревнования и подтверждающие документы — до 10 МБ.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшируется: после обновления браузер сразу получает ссылки на новую сборку.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Маршруты React Router открываются напрямую по ссылке (например, /verify/код из QR).
    location / {
        try_files $uri /index.html;
    }
}
